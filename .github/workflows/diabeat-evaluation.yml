name: DiaBeat reproducible research checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-eval.txt
      - name: Install research dependencies
        run: python -m pip install -r backend/requirements-eval.txt
      - name: Syntax check
        run: python -m py_compile backend/app.py backend/evaluate_models.py
      - name: Offline validation and dataset tests
        run: python -m unittest discover -s backend/tests -v
      - name: Generate reproducible metric report
        run: python backend/evaluate_models.py --input backend/diabetes.csv --output reports/diabeat_metrics.json
